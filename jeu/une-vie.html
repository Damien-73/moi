/* ═════════════ MOTEUR ═════════════ */
const $ = i => document.getElementById(i);
let phase = 'titre';
const POOL = Object.keys(EV).filter(k=> !EV[k].diff);

function sauve(){ try{ localStorage.setItem('unevie', JSON.stringify(S)); }catch(e){} }
function charge(){ try{ const b=localStorage.getItem('unevie'); return b?JSON.parse(b):null; }catch(e){ return null; } }

function coutVie(){
  // Un train de vie n'est pas une constante : il suit les revenus, et c'est
  // exactement pour ça que gagner plus n'enrichit presque personne.
  let c = 1900 + Math.round(revenu() * 0.52);
  if(aTrait('en_couple')) c += 800;
  if(S.enfant) c += 1000;
  if(aTrait('leve_le_pied')) c -= 500;
  if(METIERS[S.metier].rang >= 5) c += Math.round(revenu()*0.12);
  return c;
}

function avanceTemps(n){
  for(let i=0;i<n;i++){
    S.tour++; S.sais = (S.sais+1)%4;
    if(S.sais===0){ S.age++; S.an++; S.anciennete++; if(S.mandat) S.mandatAnc++; S.patrimoine = Math.round(S.patrimoine*1.028); }
    if(S.prison){
      S.prison.reste--;
      if(S.sais===0){ S.moral -= 5; S.sante -= 3; S.argent -= 1800; S.reseau -= 2; }
      if(S.prison.reste<=0){
        S.drapeaux.peine_faite = S.prison.total; S.prison=null; S.metier='rien';
        S.file.push({du:S.tour, ev:'sortie_prison', cause:null});
      }
    } else {
      S.argent += revenu() - coutVie();
      // On ne peut pas dépenser un argent qu'on n'a pas : sous le découvert
      // maximal, ce n'est plus la trésorerie qui encaisse, c'est la vie.
      if(S.argent < -7000){
        S.argent = -7000; S.moral -= 3; S.sante -= 1;
        if(!S.drapeaux.precarite){ S.drapeaux.precarite = true;
          S.file.push({du:S.tour, ev:'precarite', cause:null}); }
      }
      S.soupcon = borne(S.soupcon - 1.5);
      S.moral = borne(S.moral - 1);
      if(S.age>52) S.sante = borne(S.sante - 0.7);
      if(S.age>68) S.sante = borne(S.sante - 1.2);
    }
  }
  if(!S.prison && S.age>=64 && ['civil','public','police','affaires'].includes(sect()) && S.metier!=='retraite' && chance(.5)){
    const pension = Math.round(METIERS[S.metier].rev*0.52);
    S.drapeaux.pension = pension; S.metier='retraite'; S.salaireBonus=0;
    journalise(`Départ à la retraite (${pension.toLocaleString('fr-FR')} € par trimestre).`,'neutre');
  }
  if(S.metier==='retraite') S.argent += S.drapeaux.pension || 3600;
}

function verifieMort(){
  if(S.mort) return true;
  if(S.sante<=0){ S.mort={cause:'Santé', an:S.an}; return true; }
  if(S.moral<=2){ S.sante -= 2; if(chance(.03)){ S.mort={cause:'Il n’a pas tenu', an:S.an}; return true; } }
  // Gompertz : ~0,1 %/an à 30 ans, 0,5 % à 50, 3 % à 70, 12 % à 85.
  const annuel = 0.00008 * Math.exp(0.085 * S.age);
  const risque = (annuel/4) * (1 + (65-Math.min(65,S.sante))/40);
  if(chance(risque)){
    S.mort={cause: S.age>74?'Vieillesse':'Maladie', an:S.an}; return true;
  }
  return false;
}

function tirageEvenement(){
  const i = S.file.findIndex(e => e.du <= S.tour);
  if(i>=0){ const e = S.file.splice(i,1)[0];
    const def = EV[e.ev];
    const dejaVu = def && def.unique!==false && S.drapeaux['ev_'+e.ev];
    if(def && !dejaVu && (!def.cond || def.cond())){
      S.drapeaux['ev_'+e.ev] = true;
      return {id:e.ev, cause:e.cause};
    }
    return null;
  }
  if(S.prison){
    const pp = ['prison_offre','prison_visite'];
    if(chance(.5)) return {id: pioche(pp), cause:null};
    return null;
  }
  if(!chance(0.46)) return null;
  const cands = [];
  for(const id of POOL){
    const d = EV[id];
    if(d.cond && !d.cond()) continue;
    if(d.unique!==false && S.drapeaux['ev_'+id]) continue;
    for(let k=0;k<(d.poids||2);k++) cands.push(id);
  }
  if(!cands.length) return null;
  const id = pioche(cands);
  S.drapeaux['ev_'+id] = true;
  return {id, cause:null};
}

/* ═════════════ RENDU ═════════════ */
const el = (t,c,h)=>{ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const CLES = ['argent','sante','moral','savoir','reseau','renom','rue','soupcon'];
const NOMS_CLES = {argent:'€',sante:'Santé',moral:'Moral',savoir:'Savoir',reseau:'Réseau',
  renom:'Renom',rue:'Rue',soupcon:'Soupçon'};
const JAUGES = [['sante','Santé','vert'],['moral','Moral','bleu'],['savoir','Savoir',''],
  ['reseau','Réseau',''],['renom','Renom','or'],['rue','Rue','rouge']];

function clampAll(){ ['sante','moral','savoir','reseau','renom','rue','soupcon'].forEach(k=> S[k]=borne(Math.round(S[k]))); }

function majHaut(){
  $('haut').hidden = false; $('pied').hidden = false;
  $('h-nom').textContent = S.nom + (S.generation>1 ? ' · '+S.generation+'ᵉ génération' : '');
  $('h-poste').textContent = S.prison
    ? `Détenu — reste ${(S.prison.reste/4).toFixed(1)} an(s)`
    : METIERS[S.metier].nom + (S.mandat ? ' · ' + MANDATS[S.mandat].nom : '');
  const f = $('h-fric');
  f.textContent = (S.argent<0?'−':'') + Math.abs(Math.round(S.argent)).toLocaleString('fr-FR') + ' €';
  f.classList.toggle('dette', S.argent<0);
  $('h-date').textContent = `${SAISONS[S.sais]} ${S.an} · ${S.age} ans`;
  const g = $('h-jauges'); g.innerHTML='';
  JAUGES.forEach(([k,n,c])=>{
    const d = el('div','j');
    d.appendChild(el('div','t',n));
    d.appendChild(el('div','n',String(Math.round(S[k]))));
    const r = el('div','r'); r.appendChild(el('div','f '+c)); 
    r.firstChild.style.width = borne(S[k])+'%';
    d.appendChild(r); g.appendChild(d);
  });
  const p = $('pied-info');
  const bits = [`Soupçon <b>${Math.round(S.soupcon)}</b>`];
  if(S.condamnations) bits.push(`Casier <b>${S.condamnations}</b>`);
  if(S.patrimoine>0) bits.push(`Patrimoine <b>${Math.round(S.patrimoine).toLocaleString('fr-FR')} €</b>`);
  if(S.drapeaux.dette) bits.push(`Crédit en cours`);
  p.innerHTML = bits.join(' · ');
  $('pied-btn').hidden = true;
}

function deltasHTML(av){
  const box = el('div','deltas'); let n=0;
  CLES.forEach(k=>{
    const d = Math.round(S[k]-av[k]); if(!d) return; n++;
    const txt = k==='argent' ? (d>0?'+':'−')+Math.abs(d).toLocaleString('fr-FR')+' €'
                             : NOMS_CLES[k]+' '+(d>0?'+':'−')+Math.abs(d);
    const bon = (k==='soupcon') ? d<0 : d>0;
    box.appendChild(el('span','d '+(bon?'p':'m'), txt));
  });
  return n ? box : null;
}

/* ── vue principale ── */
let vueActive = 'jeu';
function rendre(){
  clampAll(); majHaut(); sauve();
  const v = $('vue'); v.innerHTML='';
  if(vueActive==='jeu') return vueJeu(v);
  if(vueActive==='vie') return vueVie(v);
  if(vueActive==='gens') return vueGens(v);
  return vueDossier(v);
}

function vueJeu(v){
  if(S.mort) return ecranMort();
  const c = el('div','carte fade');
  c.appendChild(el('div','lab', S.prison ? `Année de détention` : `${SAISONS[S.sais]} ${S.an} — que fais-tu de ce trimestre ?`));
  c.appendChild(el('div','titre-evt', S.prison ? 'Dedans'
    : (S.mandat ? MANDATS[S.mandat].nom : METIERS[S.metier].nom)));
  const dispo = ACTIONS.filter(a=> a.cond());
  const grps = [...new Set(dispo.map(a=>a.grp))];
  grps.forEach(gr=>{
    const g = el('div','grp'); g.appendChild(el('h4',null,gr));
    const box = el('div','acts');
    dispo.filter(a=>a.grp===gr).forEach(a=>{
      const b = el('button','act'); b.type='button';
      const d = typeof a.desc==='function' ? a.desc() : a.desc;
      b.innerHTML = `<b>${a.nom}</b><span>${d}</span>`;
      if(a.dur && a.dur()) b.classList.add('attente');
      b.addEventListener('click', ()=>faireAction(a));
      box.appendChild(b);
    });
    g.appendChild(box); c.appendChild(g);
  });
  v.appendChild(c);
}

function faireAction(a){
  const av = {}; CLES.forEach(k=>av[k]=S[k]);
  acteCourant = S.actes.length;
  S.actes.push({an:S.an, label:a.nom});
  const txt = a.fait();
  clampAll();
  journalise(a.nom, 'action');
  const v = $('vue'); v.innerHTML='';
  const c = el('div','carte fade');
  c.appendChild(el('div','lab', `${SAISONS[S.sais]} ${S.an}`));
  c.appendChild(el('div','titre-evt', a.nom));
  c.appendChild(el('div','recit','<p>'+txt+'</p>'));
  const d = deltasHTML(av); if(d) c.appendChild(d);
  const btn = el('button','cta plein', 'Continuer'); btn.type='button';
  btn.addEventListener('click', finDeTour);
  c.appendChild(btn);
  v.appendChild(c);
  majHaut(); sauve();
}

function finDeTour(){
  avanceTemps(S.prison ? 4 : 1);
  if(verifieMort()) return ecranMort();
  const pick = tirageEvenement();
  if(pick) return montrerEvenement(pick);
  vueActive='jeu'; majNav(); rendre();
}

function montrerEvenement(pick){
  const d = EV[pick.id];
  S.drapeaux['ev_'+pick.id] = true;
  const v = $('vue'); v.innerHTML='';
  const c = el('div','carte evt fade' + (d.grave?' grave':''));
  c.appendChild(el('div','lab', (d.grave?'⚠ ':'') + `${SAISONS[S.sais]} ${S.an} · ${S.age} ans`));
  c.appendChild(el('div','titre-evt', d.titre));
  c.appendChild(el('div','recit','<p>'+d.texte()+'</p>'));
  if(pick.cause!=null && S.actes[pick.cause]){
    const a = S.actes[pick.cause];
    c.appendChild(el('div','cause', `Ceci découle de ton choix de <b>${a.an}</b> :<br><b>« ${a.label} »</b>`));
  }
  const opts = el('div','opts');
  d.choix.forEach(ch=>{
    if(ch.cond && !ch.cond()) return;
    const b = el('button','opt'+(ch.risk?' risk':'')+(ch.gain?' gain':'')); b.type='button';
    b.innerHTML = ch.t + (ch.sub && ch.sub!=='' ? `<span class="sub">${ch.sub}</span>` : '');
    b.addEventListener('click', ()=>resoudreEv(d, ch, pick));
    opts.appendChild(b);
  });
  c.appendChild(opts);
  v.appendChild(c);
  majHaut(); sauve();
  window.scrollTo({top:0});
}

function resoudreEv(d, ch, pick){
  const av = {}; CLES.forEach(k=>av[k]=S[k]);
  acteCourant = S.actes.length;
  S.actes.push({an:S.an, label:ch.t.replace(/<[^>]+>/g,'')});
  const txt = ch.fait();
  clampAll();
  journalise(`${d.titre} — ${ch.t.replace(/<[^>]+>/g,'')}`, d.grave?'grave':'imp', pick.cause);
  if(S.prison && S.metier==='detenu' && !S.drapeaux['ev_prison_arrivee']){
    S.file.push({du:S.tour, ev:'prison_arrivee', cause:acteCourant});
  }
  const v = $('vue'); v.innerHTML='';
  const c = el('div','carte fade');
  c.appendChild(el('div','lab', `${SAISONS[S.sais]} ${S.an}`));
  c.appendChild(el('div','titre-evt', d.titre));
  c.appendChild(el('div','recit','<p>'+txt+'</p>'));
  const dl = deltasHTML(av); if(dl) c.appendChild(dl);
  const btn = el('button','cta plein','Continuer'); btn.type='button';
  btn.addEventListener('click', ()=>{
    if(verifieMort()) return ecranMort();
    const suite = tirageEvenement();
    if(suite && suite.cause!=null) return montrerEvenement(suite);
    if(suite) S.file.push({du:S.tour+1, ev:suite.id, cause:null});
    vueActive='jeu'; majNav(); rendre();
  });
  c.appendChild(btn);
  v.appendChild(c);
  majHaut(); sauve();
  window.scrollTo({top:0});
}

/* ── panneaux ── */
function vueVie(v){
  const c = el('div','carte fade');
  c.appendChild(el('div','lab','Chronologie'));
  c.appendChild(el('div','titre-evt','Ce que tu as fait'));
  if(!S.journal.length){ c.appendChild(el('p','vide','Rien encore.')); v.appendChild(c); return; }
  const liste = S.journal.slice().reverse().slice(0,90);
  liste.forEach(j=>{
    const a = el('div','an'+(j.type==='grave'?' grave':(j.type==='imp'?' imp':'')));
    a.appendChild(el('div','q', `${SAISONS[j.sais]} ${j.an}${j.age?' · '+j.age+' ans':''}`));
    a.appendChild(el('div','w', j.txt));
    if(j.cause!=null && S.actes[j.cause])
      a.appendChild(el('div','lk', `↳ conséquence de ton choix de ${S.actes[j.cause].an} : « ${S.actes[j.cause].label} »`));
    c.appendChild(a);
  });
  v.appendChild(c);
}

function vueGens(v){
  const c = el('div','carte fade');
  c.appendChild(el('div','lab','Entourage'));
  c.appendChild(el('div','titre-evt','Les gens'));
  const g = Object.values(S.gens);
  if(!g.length){ c.appendChild(el('p','vide','Tu n’as encore croisé personne qui compte.')); v.appendChild(c); return; }
  g.forEach(p=>{
    const l = el('div','ligne');
    const d = el('div','g');
    d.appendChild(el('div','nm', p.nom));
    d.appendChild(el('div','ds', p.desc + ' · rencontré en ' + p.rencontre));
    const bar = el('div','memo');
    bar.appendChild(el('li',null,`Lien ${Math.round(p.lien)} · Rancune ${Math.round(p.rancune)}`));
    p.memoire.forEach(m=> bar.appendChild(el('li',null,m)));
    d.appendChild(bar);
    l.appendChild(d);
    const st = p.statut==='mort' ? 'puce mort' : (p.statut==='vivant' ? 'puce ok' : 'puce att');
    const lib = {vivant:'Vivant', mort:'Mort', prison:'Détenu', parti:'Parti'}[p.statut];
    l.appendChild(el('span',st,lib));
    c.appendChild(l);
  });
  v.appendChild(c);
}

function vueDossier(v){
  const c = el('div','carte fade');
  c.appendChild(el('div','lab','État civil et judiciaire'));
  c.appendChild(el('div','titre-evt', S.nom));
  const info = [
    ['Âge', S.age+' ans'], ['Métier', METIERS[S.metier].nom],
    ['Mandat', S.mandat ? MANDATS[S.mandat].nom : '—'],
    ['Origine', {populaire:'Quartier populaire',moyenne:'Classe moyenne',aisee:'Famille aisée'}[S.origine]],
    ['Liquide', Math.round(S.argent).toLocaleString('fr-FR')+' €'],
    ['Patrimoine', Math.round(S.patrimoine).toLocaleString('fr-FR')+' €'],
    ['Actes délictueux', S.stats.crimes], ['Refus assumés', S.stats.refus]
  ];
  info.forEach(([k,val])=>{
    const l = el('div','ligne');
    l.appendChild(el('div','ds',k));
    l.appendChild(el('span','puce', String(val)));
    c.appendChild(l);
  });
  v.appendChild(c);

  const t = el('div','carte fade');
  t.appendChild(el('div','lab','Ce que tu es devenu'));
  const LIB_TRAITS = {milieu:'Est entré dans le milieu', detenu:'A fait de la prison',
    repenti:'S’est rangé à sa sortie', corrompu:'A vendu une décision publique',
    incorruptible:'A refusé et signalé', integre:'Intègre — et isolé',
    balance:'A donné un nom en garde à vue', lache:'A fait porter sa faute à un autre',
    indic:'A travaillé avec la police contre les siens', ripou:'Policier corrompu',
    entrepreneur:'A monté son affaire', faillite:'A déposé le bilan',
    parent:'Parent', en_couple:'En couple', exil:'A tout quitté pour repartir ailleurs',
    rehabilite:'Casier effacé — réhabilitation judiciaire', educateur_pro:'Éducateur',
    sorti_pour_de_bon:'A refusé assez de fois pour qu’on cesse de demander',
    joueur:'Joue', proprietaire:'Propriétaire', deuil:'A perdu son enfant',
    sorti_du_milieu:'A quitté le milieu', achat_voix:'A acheté des soutiens',
    double_vie:'Mène une double vie', fiche_banque:'Fiché Banque de France',
    revoque:'Révoqué de la fonction publique', ineligible:'Déclaré inéligible',
    diplome_dedans:'A passé un diplôme en détention', honnete:'A payé toutes ses dettes',
    genereux:'A renoncé à un héritage pour sa famille', reconverti:'S’est reconverti'};
  const ks = Object.keys(S.traits).filter(k=>LIB_TRAITS[k]);
  if(!ks.length) t.appendChild(el('p','vide','Rien de marquant pour l’instant.'));
  ks.forEach(k=>{
    const l = el('div','ligne');
    l.appendChild(el('div','ds', LIB_TRAITS[k]));
    l.appendChild(el('span','puce', String(S.traits[k])));
    t.appendChild(l);
  });
  v.appendChild(t);

  if(S.casier.length){
    const j = el('div','carte fade');
    j.appendChild(el('div','lab','Casier judiciaire'));
    S.casier.forEach(cd=>{
      const l = el('div','ligne');
      const d = el('div','g');
      d.appendChild(el('div','nm', cd.motif));
      d.appendChild(el('div','ds', 'Condamnation de '+cd.an));
      l.appendChild(d);
      l.appendChild(el('span','puce mort', (cd.peine/4).toFixed(1)+' ans'));
      j.appendChild(l);
    });
    if(aTrait('rehabilite')) j.appendChild(el('div','tampon','Réhabilité'));
    else if(S.casier.length) j.appendChild(el('div','tampon','Bulletin n° 2 non vierge'));
    v.appendChild(j);
  }
}

/* ── mort & génération suivante ── */
function ecranMort(){
  $('pied').hidden = true;
  const v = $('vue'); v.innerHTML='';
  const c = el('div','ecran fade');
  c.appendChild(el('div','lab', `${S.an} · ${S.age} ans`));
  c.appendChild(el('h1',null, S.nom));
  c.appendChild(el('p','chapo', S.mort.cause));

  const b = el('div','bilan');
  const enfant = S.enfant && S.gens[S.enfant] ? S.gens[S.enfant] : null;
  const morts = Object.values(S.gens).filter(g=>g.statut==='mort').length;
  [['Années vécues', S.age], ['Patrimoine laissé', Math.round(S.patrimoine+Math.max(0,S.argent)).toLocaleString('fr-FR')+' €'],
   ['Années de prison', (S.casier.reduce((a,x)=>a+x.peine,0)/4).toFixed(1)],
   ['Fois où tu as dit non', S.stats.refus],
   ['Proches enterrés', morts], ['Métier final', S.mandat ? MANDATS[S.mandat].nom : METIERS[S.metier].nom]
  ].forEach(([k,val])=>{
    const d = document.createElement('div');
    d.appendChild(el('div','lab',k)); d.appendChild(el('div','v',String(val)));
    b.appendChild(d);
  });
  c.appendChild(b);

  const juge = el('div','carte');
  juge.appendChild(el('div','lab','Ce qui restera'));
  const phrases = [];
  if(aTrait('incorruptible')||aTrait('integre')) phrases.push(`On se souviendra que tu as refusé quelque chose que presque personne ne refuse.`);
  if(aTrait('corrompu')) phrases.push(`Ton nom apparaît dans un jugement que n’importe qui peut lire.`);
  if(S.stats.morts) phrases.push(`${S.stats.morts} personne(s) ne sont pas mortes de vieillesse à cause de toi.`);
  if(aTrait('repenti')&&aTrait('detenu')) phrases.push(`Tu es sorti, tu as tenu, et c’est plus rare que tout le reste.`);
  if(aTrait('educateur_pro')) phrases.push(`Des gamins de quinze ans se souviennent d’une phrase que tu as dite.`);
  if(S.patrimoine>200000) phrases.push(`Tu laisses de quoi changer la vie de quelqu’un.`);
  if(!phrases.length) phrases.push(`Une vie ordinaire, ce qui est la chose la plus difficile à réussir.`);
  juge.appendChild(el('div','recit','<p>'+phrases.join(' ')+'</p>'));
  c.appendChild(juge);

  if(enfant && enfant.statut!=='mort'){
    const btn = el('button','cta plein', `Continuer avec ${enfant.nom}`); btn.type='button';
    btn.addEventListener('click', ()=>{
      const h = {generation:S.generation+1,
        argent: Math.round((S.patrimoine + Math.max(0,S.argent)) * (enfant.lien>55?0.6:0.25)),
        reseau: Math.round(S.reseau*0.3), renom: Math.round(S.renom*0.35), lien:enfant.lien};
      const nom = enfant.nom;
      S = nouvelleVie(S.origine, nom, h);
      if(h.lien<40) S.moral -= 18;
      S.journal.push({an:S.an, sais:0, txt:`Tu hérites de ${h.argent.toLocaleString('fr-FR')} € et d’un nom que les gens connaissent déjà.`, type:'imp'});
      vueActive='jeu'; majNav(); rendre();
    });
    c.appendChild(btn);
  }
  const re = el('button','cta','Nouvelle vie'); re.type='button';
  re.addEventListener('click', ()=>{ try{localStorage.removeItem('unevie');}catch(e){} ecranTitre(null); });
  c.appendChild(re);
  v.appendChild(c);
  $('haut').hidden = false; majHaut(); $('pied').hidden = true;
  window.scrollTo({top:0});
}

/* ── titre ── */
function ecranTitre(reprise){
  $('haut').hidden = true; $('pied').hidden = true;
  phase='titre';
  const v = $('vue'); v.innerHTML='';
  const c = el('div','ecran fade');
  c.appendChild(el('div','lab','Simulateur de trajectoire · 18 ans → la fin'));
  c.appendChild(el('h1',null,'Une <em>Vie</em>'));
  c.appendChild(el('p','chapo','Tu peux être n’importe qui. Tout ce que tu choisis reste, revient, et se paie — parfois trente ans plus tard.'));

  if(reprise){
    const k = el('button','cta plein', `Reprendre — ${reprise.nom}, ${reprise.age} ans`); k.type='button';
    k.addEventListener('click', ()=>{ S=reprise; vueActive='jeu'; majNav(); rendre(); });
    c.appendChild(k);
  }

  const box = el('div','carte');
  box.appendChild(el('div','lab','D’où tu pars'));
  box.appendChild(el('div','recit','<p>Le point de départ ne décide de rien. Il décide seulement de ce qui sera facile.</p>'));
  const opts = el('div','opts');
  [['populaire','Quartier populaire','300 € · Savoir 25 · Rue 22 — peu de filet, beaucoup de portes fermées et une porte ouverte'],
   ['moyenne','Classe moyenne','2 500 € · Savoir 45 · Réseau 30 — la trajectoire par défaut'],
   ['aisee','Famille aisée','15 000 € · Savoir 60 · Réseau 55 — tu as le droit à plusieurs erreurs']
  ].forEach(([id,nom,desc])=>{
    const b = el('button','opt'); b.type='button';
    b.innerHTML = nom + `<span class="sub">${desc}</span>`;
    b.addEventListener('click', ()=>{
      S = nouvelleVie(id);
      creeGens('mere'); creeGens('ami');
      if(id==='populaire') creeGens('caid');
      vueActive='jeu'; majNav(); rendre();
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);
  c.appendChild(box);

  const r = el('div','carte');
  r.appendChild(el('div','lab','Comment ça marche'));
  const ul = el('div','recit', `<p><b>Chaque trimestre, tu choisis une action.</b> Travailler, te former, voir du monde, entrer dans le milieu, te présenter à une élection. C’est toi qui ouvres les portes.</p>
    <p><b>Puis la vie répond.</b> Les événements dépendent de ce que tu es devenu : un maire reçoit des enveloppes, un revendeur reçoit des convocations, un père reçoit un appel du collège.</p>
    <p><b>Rien ne se referme.</b> La prison n’est pas une fin : tu en sors, avec un casier qui bloque les embauches et d’anciens amis qui reviennent te proposer la seule chose que tu saches faire.</p>
    <p><b>Et quand tu meurs, tu continues avec ton enfant</b> — qui hérite de ton argent, de ton nom, et de ce que tu lui as fait.</p>`);
  r.appendChild(ul);
  c.appendChild(r);
  v.appendChild(c);
}

/* ── navigation ── */
function majNav(){
  document.querySelectorAll('.nav button').forEach(b=>
    b.setAttribute('aria-current', String(b.dataset.vue===vueActive)));
}
document.querySelectorAll('.nav button').forEach(b=>{
  b.addEventListener('click', ()=>{ vueActive=b.dataset.vue; majNav(); rendre(); });
});

function demarre(etat){
  if(etat && etat.nom){ S=etat; vueActive='jeu'; majNav(); rendre(); return; }
  const sv = charge();
  ecranTitre(sv && sv.nom && !sv.mort ? sv : null);
}
window.claude?.hot?.snapshot?.(()=>S);
if(window.claude?.hot?.ready) window.claude.hot.ready(demarre);
else demarre(window.claude?.hot?.data ?? null);
</script>
